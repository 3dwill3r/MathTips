<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <title>MathTips - Cadastro</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- Bootstrap -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />

        <!-- Fonte -->
        <link
            href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap"
            rel="stylesheet"
        />

        <!-- CSS -->
        <link rel="stylesheet" href="../css/cadastro.css" />
    </head>

    <body>
        <div class="container cadastro-container fade-in">
            <header
                class="d-flex justify-content-between align-items-center mb-4"
            >
                <h1 class="logo">📘 MathTips</h1>

                <div class="form-check form-switch">
                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="darkModeToggle"
                    />
                    <label class="form-check-label">🌙</label>
                </div>
            </header>

            <div class="card cadastro-card">
                <div class="card-body">
                    <h2 class="text-center mb-3">Criar conta</h2>

                    <form id="cadastroForm">
                        <div class="mb-3">
                            <label>Nome completo</label>
                            <input
                                type="text"
                                class="form-control"
                                id="nome"
                                placeholder="Seu nome completo"
                                required
                            />
                        </div>

                        <div class="mb-3">
                            <label>Email</label>
                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                placeholder="exemplo@gmail.com"
                                required
                            />
                        </div>
                        <div class="mb-3">
                            <label>CPF</label>
                            <input
                                type="text"
                                class="form-control"
                                id="cpf"
                                placeholder="000.000.000-00"
                                maxlength="14"
                                required
                            />
                        </div>

                        <div class="mb-3">
                            <label>Telefone</label>
                            <input
                                type="text"
                                class="form-control"
                                id="telefone"
                                placeholder="(00) 90000-0000"
                                maxlength="15"
                                required
                            />
                        </div>
                        <div class="mb-3">
                            <label>Senha</label>
                            <input
                                type="password"
                                class="form-control"
                                id="senha"
                                placeholder="senhaexemplo123"
                                required
                            />
                        </div>

                        <div class="mb-3">
                            <label>Confirmar senha</label>
                            <input
                                type="password"
                                class="form-control"
                                id="confirmarSenha"
                                placeholder="repita a senha aqui"
                                required
                            />
                        </div>

                        <button class="btn btn-primary w-100">Cadastrar</button>
                    </form>

                    <p class="text-center mt-3">
                        Já tem conta? <a href="login.html">Entrar</a>
                    </p>
                </div>
            </div>
        </div>

        <script src="../js/darkmode.js"></script>
        <script src="../js/cadastro.js"></script>
    </body>
</html>
